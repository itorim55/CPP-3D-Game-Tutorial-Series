<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-key="vs.title">1 vs 1 — Comparator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='0,0 50,0 64,14 64,64 0,64' fill='%23ff5b26'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230b0d11'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.vs-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
.vs-name { font-family: var(--font-display); font-size: clamp(22px, 4vw, 38px); letter-spacing: 1px; text-align: center; }
.vs-badge-mid { font-family: var(--font-display); font-size: 30px; color: var(--accent); text-align: center; }
.cmp-row { display: grid; grid-template-columns: 1fr 160px 1fr; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid #252b35; font-size: 15px; }
.cmp-row:last-child { border-bottom: 0; }
.cmp-row .metric { text-align: center; color: var(--ink-muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .5px; }
.cmp-row .val { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.cmp-row .val.win { color: var(--good); font-weight: 800; }
.h2h-banner { text-align: center; padding: 22px; }
.h2h-banner .score { font-family: var(--font-display); font-size: 54px; letter-spacing: 3px; }

/* fight card: os dois lados embatem, o VS carimba-se no meio */
.vs-grid .vs-name:first-child { animation: clashL .5s cubic-bezier(.2, 1.2, .3, 1) backwards; }
.vs-grid .vs-name:last-child { animation: clashR .5s cubic-bezier(.2, 1.2, .3, 1) backwards; }
.vs-badge-mid { animation: stamp .45s cubic-bezier(.2, 1.4, .3, 1) .35s backwards; position: relative; padding: 10px 0; }
@keyframes clashL { from { opacity: 0; transform: translateX(-46px); } }
@keyframes clashR { from { opacity: 0; transform: translateX(46px); } }
.vs-name .pfp.leads { border: 2px solid var(--ember); box-shadow: 0 0 22px rgba(255, 176, 32, .5); }

/* tale of the tape: barras espelhadas por métrica */
.cmp-bars { grid-column: 1 / -1; display: flex; justify-content: center; gap: 2px; height: 4px; margin-top: 2px; }
.cmp-bars i { display: block; background: var(--line-2); max-width: 50%; animation: cmpgrow .7s cubic-bezier(.2, .7, .2, 1) backwards; }
.cmp-bars i:first-child { transform-origin: right; }
.cmp-bars i:last-child { transform-origin: left; }
.cmp-bars i.w { background: var(--accent); box-shadow: 0 0 8px rgba(255, 91, 38, .5); }
@keyframes cmpgrow { from { transform: scaleX(0); } }
</style>
</head>
<body>

<header></header>

<main>
  <h2 class="section" style="margin-top:6px" data-i18n="vs.title">⚔️ 1 vs 1 — Player comparator</h2>
  <p style="color:var(--ink-muted);font-size:13px" data-i18n="vs.sub">Pick two players and see who's boss. Includes their direct head-to-head history.</p>

  <div class="grid cols-2" style="margin-top:14px;max-width:760px">
    <div>
      <input type="text" id="search-a" placeholder="🔍 player A…" data-i18n-ph="vs.phA" autocomplete="off">
      <div id="results-a" class="feed" style="margin-top:6px"></div>
    </div>
    <div>
      <input type="text" id="search-b" placeholder="🔍 player B…" data-i18n-ph="vs.phB" autocomplete="off">
      <div id="results-b" class="feed" style="margin-top:6px"></div>
    </div>
  </div>

  <div id="comparison" style="margin-top:24px"></div>
</main>

<footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
let A = params.get('a'), B = params.get('b');

function attachSearch(input, results, assign) {
  let timer = null;
  document.getElementById(input).addEventListener('input', (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    const out = document.getElementById(results);
    if (q.length < 2) { out.innerHTML = ''; return; }
    timer = setTimeout(async () => {
      const r = await api(`/api/search?q=${encodeURIComponent(q)}`);
      out.innerHTML = r.rows.map((p) => `
        <div class="row" style="cursor:pointer" data-pick="${esc(p.steam_id)}" data-name="${esc(p.name)}">
          <b>${esc(p.name)}</b><span class="meta">${hours(p.playtime_s)}</span>
        </div>`).join('') || `<p style="color:var(--ink-muted);font-size:13px">${t('vs.nothing')}</p>`;
      out.querySelectorAll('[data-pick]').forEach((el) => el.addEventListener('click', () => {
        assign(el.dataset.pick);
        document.getElementById(input).value = el.dataset.name;
        out.innerHTML = '';
        maybeLoad();
      }));
    }, 250);
  });
}

attachSearch('search-a', 'results-a', (id) => { A = id; });
attachSearch('search-b', 'results-b', (id) => { B = id; });

function maybeLoad() {
  if (!A || !B) return;
  if (A === B) { document.getElementById('comparison').innerHTML = `<div class="notice err">${t('vs.same')}</div>`; return; }
  history.replaceState(null, '', `/vs?a=${encodeURIComponent(A)}&b=${encodeURIComponent(B)}`);
  load();
}

async function load() {
  const el = document.getElementById('comparison');
  el.innerHTML = `<p style="color:var(--ink-muted)">${t('loading')}</p>`;
  let c;
  try { c = await api(`/api/compare?a=${encodeURIComponent(A)}&b=${encodeURIComponent(B)}`); }
  catch (e) { el.innerHTML = `<div class="notice err">⚠️ ${esc(e.message)}</div>`; return; }

  let rowIdx = 0;
  const row = (label, va, vb, fmt = (x) => x, higherWins = true) => {
    const winA = higherWins ? va > vb : va < vb;
    const winB = higherWins ? vb > va : vb < va;
    const tot = (Number(va) + Number(vb)) || 1;
    const pa = Math.round(Number(va) / tot * 100);
    const delay = (rowIdx++) * 70;
    return `<div class="cmp-row">
      <div class="val ${winA ? 'win' : ''}">${fmt(va)}</div>
      <div class="metric">${label}</div>
      <div class="val ${winB ? 'win' : ''}">${fmt(vb)}</div>
      <div class="cmp-bars">
        <i class="${winA ? 'w' : ''}" style="width:${pa}%;animation-delay:${delay}ms"></i>
        <i class="${winB ? 'w' : ''}" style="width:${100 - pa}%;animation-delay:${delay}ms"></i>
      </div>
    </div>`;
  };

  const total = c.h2h.aKilledB + c.h2h.bKilledA;
  const leader = c.h2h.aKilledB > c.h2h.bKilledA ? c.a.name
    : c.h2h.bKilledA > c.h2h.aKilledB ? c.b.name : null;
  const leadSide = c.h2h.aKilledB > c.h2h.bKilledA ? 0 : c.h2h.bKilledA > c.h2h.aKilledB ? 1 : -1;

  el.innerHTML = `
    <div class="vs-grid">
      <div class="vs-name">${pfp(c.a.avatar, c.a.name, 52)}<br>${playerLink(c.a.steamId, c.a.name)}<br>
        <span style="font-size:14px;color:var(--gold);font-family:var(--font-body)">${c.a.elo ? `${esc(c.a.elo.tier)} · ${c.a.elo.rating}` : '—'}</span></div>
      <div class="vs-badge-mid">VS</div>
      <div class="vs-name">${pfp(c.b.avatar, c.b.name, 52)}<br>${playerLink(c.b.steamId, c.b.name)}<br>
        <span style="font-size:14px;color:var(--gold);font-family:var(--font-body)">${c.b.elo ? `${esc(c.b.elo.tier)} · ${c.b.elo.rating}` : '—'}</span></div>
    </div>

    <div class="card h2h-banner" style="margin-top:18px">
      <div style="color:var(--ink-muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px">${t('vs.h2h')}</div>
      <div class="score">${c.h2h.aKilledB} — ${c.h2h.bKilledA}</div>
      <div style="color:var(--ink-2);font-size:14px">
        ${total === 0 ? t('vs.never') : leader ? t('vs.dominates', esc(leader)) : t('vs.tie')}
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3>${t('vs.thisWipe')}</h3>
      ${row(t('vs.kills'), c.a.wipe.kills, c.b.wipe.kills)}
      ${row(t('vs.deaths'), c.a.wipe.deaths, c.b.wipe.deaths, (x) => x, false)}
      ${row('K/D', c.a.wipe.kd, c.b.wipe.kd, (x) => x.toFixed(2))}
      ${row(t('vs.headshots'), c.a.wipe.headshots, c.b.wipe.headshots)}
      ${row(t('vs.hsRate'), c.a.wipe.hsRate, c.b.wipe.hsRate, (x) => x + '%')}
      ${row(t('vs.longest'), c.a.wipe.bestDistance, c.b.wipe.bestDistance, (x) => x + ' m')}
      ${row(t('vs.streak'), c.a.wipe.streak, c.b.wipe.streak, (x) => x ? '🔥 ' + x : '0')}
      ${row(t('vs.structures'), c.a.wipe.structuresDestroyed, c.b.wipe.structuresDestroyed)}
      ${row(t('vs.hours'), c.a.wipe.hours, c.b.wipe.hours)}
    </div>

    <div class="card" style="margin-top:14px">
      <h3>${t('vs.allTime')}</h3>
      ${row(t('vs.kills'), c.a.allTime.kills, c.b.allTime.kills)}
      ${row('K/D', c.a.allTime.kd, c.b.allTime.kd, (x) => x.toFixed(2))}
      ${row(t('vs.hours'), c.a.allTime.hours, c.b.allTime.hours)}
    </div>

    ${c.h2h.recent.length ? `
    <div class="card" style="margin-top:14px">
      <h3>${t('vs.recent')}</h3>
      <div class="feed">
        ${c.h2h.recent.map((k) => `
          <div class="row">
            <span class="who k">${esc(k.attacker_id === c.a.steamId ? c.a.name : c.b.name)}</span>
            <span class="weapon">${esc(k.weapon || '?')}${k.distance ? ` · ${Math.round(k.distance)}m` : ''}</span>
            ${k.headshot ? '<span class="hs">HS</span>' : ''}
            <span class="who v">${esc(k.attacker_id === c.a.steamId ? c.b.name : c.a.name)}</span>
            <span class="meta">${timeAgo(k.ts)}</span>
          </div>`).join('')}
      </div>
    </div>` : ''}`;

  // moldura âmbar no avatar de quem domina o head-to-head
  if (leadSide >= 0) {
    const pfps = el.querySelectorAll('.vs-name .pfp');
    if (pfps[leadSide]) pfps[leadSide].classList.add('leads');
  }
}

if (A && B) load();
</script>
</body>
</html>
