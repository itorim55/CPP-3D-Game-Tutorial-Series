<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-key="conta.title">My account</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='0,0 50,0 64,14 64,64 0,64' fill='%23ff5b26'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230b0d11'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header></header>

<main id="content">
  <p style="color:var(--ink-muted)" data-i18n="loading">loading…</p>
</main>

<footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const el = document.getElementById('content');
  const err = new URLSearchParams(location.search).get('erro');
  const user = await me();

  if (!user.loggedIn) {
    el.innerHTML = `
      ${err ? `<div class="notice err">${t('account.loginFailed')}</div>` : ''}
      <div class="card" style="max-width:480px;margin:40px auto;text-align:center;padding:36px">
        <h2 style="font-family:var(--font-display);font-size:30px;letter-spacing:2px">${t('account.title')}</h2>
        <p style="color:var(--ink-2);margin:12px 0 22px">${t('account.loginDesc')}</p>
        <a class="btn" href="/auth/steam">${t('account.loginBtn')}</a>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px">
      ${pfp(user.avatar, user.name, 56, 'pfp-lg')}
      <h1 style="font-family:var(--font-display);font-size:40px;letter-spacing:2px">${esc(user.name || t('account.survivor'))}</h1>
      <span style="color:var(--ink-muted);font-size:13px">SteamID ${esc(user.steamId)}</span>
      <a href="/auth/logout" class="quiet" style="margin-left:auto;font-size:13px">${t('account.logout')}</a>
    </div>
    ${user.playtimeS ? '' : `<div class="notice err" style="margin-top:10px">${t('account.notSeenYet')}</div>`}

    <div class="grid cols-4" style="margin-top:18px">
      <div class="card tile"><div class="big" style="color:var(--gold)">${fmtNum(user.wallet.gems)}</div><div class="label">${t('account.gemsAvailable')}</div></div>
      <div class="card tile"><div class="big">${fmtNum(user.wallet.earned_total)}</div><div class="label">${t('account.gemsTotal')}</div></div>
      <div class="card tile"><div class="big">${hours(user.playtimeS)}</div><div class="label">${t('account.playtime')}</div></div>
      <div class="card tile"><div class="big">×${user.voteWeight}</div><div class="label">${t('account.voteWeight')}</div></div>
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="/loja">${t('account.goStore')}</a>
      <a class="btn ghost" href="/mapa">${t('account.goMap')}</a>
      <a class="btn ghost" href="/player?id=${encodeURIComponent(user.steamId)}">${t('account.myProfile')}</a>
      <a class="btn ghost" href="/apelo">${t('account.goAppeal')}</a>
    </div>

    <h2 class="section">${t('account.myRedemptions')}</h2>
    ${user.redemptions.length ? `<div class="table-wrap"><table>
      <thead><tr><th>${t('store.thWhen')}</th><th>${t('store.thItem')}</th><th class="num">${t('store.thCost')}</th><th>${t('store.thStatus')}</th></tr></thead>
      <tbody>${user.redemptions.map((r) => `
        <tr><td>${timeAgo(r.ts)}</td><td>${esc(r.name || '?')}</td>
        <td class="num">${fmtNum(r.cost)} 💎</td>
        <td><span class="badge ${esc(r.status)}">${tStatus(r.status)}</span></td></tr>`).join('')}</tbody>
    </table></div>` : `<p style="color:var(--ink-muted)">${t('account.noRedemptions')}</p>`}

    <h2 class="section">${t('account.myAppeals')}</h2>
    ${user.appeals.length ? user.appeals.map((a) => `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
          <span class="badge ${esc(a.status)}">${tStatus(a.status)}</span>
          <span style="color:var(--ink-muted);font-size:12.5px">${timeAgo(a.ts)}</span>
        </div>
        <p style="color:var(--ink-2);font-size:13.5px;margin-top:8px">${esc(a.text)}</p>
        ${a.response ? `<p style="margin-top:10px;padding:10px 14px;background:var(--surface-2);border-radius:8px;font-size:13.5px">
          <b>${t('account.staffReply')}</b> ${esc(a.response)}</p>` : ''}
      </div>`).join('') : `<p style="color:var(--ink-muted)">${t('account.noAppeals')}</p>`}`;
})().catch(console.error);
</script>
</body>
</html>
