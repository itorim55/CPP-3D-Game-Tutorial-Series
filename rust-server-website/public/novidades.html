<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novidades — LusoRust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header></header>

<main class="prose" style="max-width:820px">
  <h2 class="section" style="margin-top:6px">Novidades e changelog</h2>
  <p style="color:var(--ink-muted);font-size:13px">O que mudou no servidor, wipe a wipe.</p>
  <div id="posts" style="margin-top:16px;display:flex;flex-direction:column;gap:16px">a carregar…</div>
</main>

<footer></footer>

<script src="/js/common.js"></script>
<script>
api('/api/posts').then((data) => {
  document.getElementById('posts').innerHTML = data.rows.map((p) => `
    <div class="card post">
      <h3>${esc(p.title)}</h3>
      <div class="date">${fmtDate(p.ts)}</div>
      <p>${esc(p.body)}</p>
    </div>`).join('') || '<p style="color:var(--ink-muted)">Ainda sem publicações.</p>';
}).catch(console.error);
</script>
</body>
</html>
