<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-key="news.title">News</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='0,0 50,0 64,14 64,64 0,64' fill='%23ff5b26'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230b0d11'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header></header>

<main class="prose" style="max-width:820px">
  <h2 class="section" style="margin-top:6px" data-i18n="news.title">News and changelog</h2>
  <p style="color:var(--ink-muted);font-size:13px" data-i18n="news.sub">What changed on the server, wipe by wipe.</p>
  <div id="posts" style="margin-top:16px;display:flex;flex-direction:column;gap:16px" data-i18n="loading">loading…</div>
</main>

<footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
api('/api/posts').then((data) => {
  document.getElementById('posts').innerHTML = data.rows.map((p) => `
    <div class="card post">
      <h3>${esc(p.title)}</h3>
      <div class="date">${fmtDate(p.ts)}</div>
      <p style="white-space:pre-line">${esc(p.body)}</p>
    </div>`).join('') || `<p style="color:var(--ink-muted)">${t('news.empty')}</p>`;
}).catch(console.error);
</script>
</body>
</html>
