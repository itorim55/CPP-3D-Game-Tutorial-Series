<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-key="heat.title">Death Heatmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='0,0 50,0 64,14 64,64 0,64' fill='%23ff5b26'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230b0d11'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header></header>

<main>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px">
    <h2 class="section" style="margin:0" data-i18n="heat.title">🗺️ Death heatmap</h2>
    <select id="wipe-select" style="width:auto;padding:7px 14px;font-size:13px"></select>
  </div>
  <p style="color:var(--ink-muted);font-size:13px;margin-top:6px" data-i18n="heat.desc">
    Where people die on this map. The hotter (orange→white), the more deaths in the area.
    North is up; game coordinates normalized to map size.
  </p>

  <div class="card" style="margin-top:16px;max-width:820px">
    <div style="position:relative" id="map-wrap">
      <canvas id="map" style="width:100%;display:block;background:#0e1015"></canvas>
    </div>
    <p id="meta" style="color:var(--ink-muted);font-size:12.5px;margin-top:10px"></p>
  </div>
</main>

<footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
const SIZE = 760; // resolução interna do canvas
let runId = 0;    // aborta animações antigas quando se muda de wipe

async function load(wipeId) {
  const myRun = ++runId;
  const data = await api(`/api/heatmap${wipeId ? `?wipeId=${wipeId}` : ''}`);
  if (myRun !== runId) return;
  const canvas = document.getElementById('map');
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');

  // fundo: imagem do mapa se configurada, senão grelha estilizada
  const drawBase = () => new Promise((resolve) => {
    ctx.fillStyle = '#0e1015';
    ctx.fillRect(0, 0, SIZE, SIZE);
    if (data.mapImage) {
      // sem crossOrigin: não fazemos leitura de píxeis, e exigir CORS
      // rejeitava imagens válidas de CDNs sem Access-Control-Allow-Origin
      const img = new Image();
      img.onload = () => { ctx.globalAlpha = 0.55; ctx.drawImage(img, 0, 0, SIZE, SIZE); ctx.globalAlpha = 1; resolve(); };
      img.onerror = () => resolve();
      img.src = data.mapImage;
    } else {
      ctx.strokeStyle = '#232a34'; ctx.lineWidth = 1;
      const grid = SIZE / 10;
      ctx.font = '10px "IBM Plex Mono", monospace'; ctx.fillStyle = '#5c6675';
      const letters = 'ABCDEFGHIJ';
      for (let i = 0; i <= 10; i++) {
        ctx.beginPath(); ctx.moveTo(i * grid, 0); ctx.lineTo(i * grid, SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * grid); ctx.lineTo(SIZE, i * grid); ctx.stroke();
        if (i < 10) { ctx.fillText(letters[i], i * grid + grid / 2 - 3, 12); ctx.fillText(String(i), 4, i * grid + grid / 2 + 3); }
      }
      resolve();
    }
  });

  await drawBase();
  if (myRun !== runId) return;

  const mapSize = data.mapSize || 3800;
  const half = mapSize / 2;
  // x do jogo -> este; z do jogo -> norte (canvas y invertido)
  const toCanvas = (p) => [
    ((p.x + half) / mapSize) * SIZE,
    SIZE - ((p.z + half) / mapSize) * SIZE,
  ];

  // snapshot do fundo para compor a cada frame da ignição
  const base = document.createElement('canvas');
  base.width = base.height = SIZE;
  base.getContext('2d').drawImage(canvas, 0, 0);

  // camada de calor aditiva + contagem por célula (grelha 10×10)
  const heat = document.createElement('canvas');
  heat.width = heat.height = SIZE;
  const hctx = heat.getContext('2d');
  hctx.globalCompositeOperation = 'lighter';
  const R = 26;
  const cells = new Int32Array(100);
  const drawPoint = (p) => {
    const [cx, cy] = toCanvas(p);
    if (cx < -R || cy < -R || cx > SIZE + R || cy > SIZE + R) return;
    const col = Math.min(9, Math.max(0, Math.floor(cx / (SIZE / 10))));
    const row = Math.min(9, Math.max(0, Math.floor(cy / (SIZE / 10))));
    cells[col + 10 * row]++;
    const g = hctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    g.addColorStop(0, 'rgba(255, 91, 38, 0.28)');
    g.addColorStop(0.5, 'rgba(255, 91, 38, 0.10)');
    g.addColorStop(1, 'rgba(255, 91, 38, 0)');
    hctx.fillStyle = g;
    hctx.beginPath(); hctx.arc(cx, cy, R, 0, Math.PI * 2); hctx.fill();
  };

  // as mortes chegam DESC — inverter para a ilha "arder" em ordem cronológica
  const pts = data.points.slice().reverse();

  const finish = () => { instrument(cells, canvas); };

  if (reduceMotion || pts.length < 40) {
    for (const p of pts) drawPoint(p);
    ctx.drawImage(heat, 0, 0);
    finish();
  } else {
    const per = Math.max(1, Math.ceil(pts.length / 90));
    let i = 0;
    const step = () => {
      if (myRun !== runId) return; // trocaram de wipe a meio
      for (let k = 0; k < per && i < pts.length; k++, i++) drawPoint(pts[i]);
      ctx.drawImage(base, 0, 0);
      ctx.drawImage(heat, 0, 0);
      if (i < pts.length) requestAnimationFrame(step);
      else finish();
    };
    requestAnimationFrame(step);
  }

  document.getElementById('meta').textContent =
    t('heat.deaths', fmtNum(data.points.length), mapSize) +
    ''; // a dica de configuração (mapImage) é assunto de operador, não dos visitantes
}

// anel na zona mais mortífera + inspeção célula-a-célula com mira
function instrument(cells, canvas) {
  const wrap = document.getElementById('map-wrap');
  wrap.querySelectorAll('.hotzone, .xh-v, .xh-h, .cell-tip').forEach((e) => e.remove());

  let best = 0, bi = -1;
  for (let i = 0; i < 100; i++) if (cells[i] > best) { best = cells[i]; bi = i; }
  const letters = 'ABCDEFGHIJ';
  if (bi >= 0 && best > 0) {
    const col = bi % 10, row = (bi / 10) | 0;
    wrap.insertAdjacentHTML('beforeend',
      `<div class="hotzone" style="left:${(col + 0.5) * 10}%;top:${(row + 0.5) * 10}%">
         <i></i><b>${t('heat.hotzone')} ${letters[col]}${row} · ${best}</b></div>`);
  }

  wrap.insertAdjacentHTML('beforeend',
    '<div class="xh-v"></div><div class="xh-h"></div><div class="chart-tip cell-tip"></div>');
  const xv = wrap.querySelector('.xh-v'), xh = wrap.querySelector('.xh-h'), tip = wrap.querySelector('.cell-tip');
  canvas.onmousemove = (ev) => {
    const r = canvas.getBoundingClientRect();
    const px = ev.clientX - r.left, py = ev.clientY - r.top;
    const col = Math.min(9, Math.max(0, Math.floor(px / r.width * 10)));
    const row = Math.min(9, Math.max(0, Math.floor(py / r.height * 10)));
    xv.style.cssText = `display:block;left:${px}px`;
    xh.style.cssText = `display:block;top:${py}px`;
    tip.style.display = 'block';
    tip.style.left = `${px}px`; tip.style.top = `${py}px`;
    tip.innerHTML = `${letters[col]}${row} · <b>${cells[col + 10 * row]}</b> ${t('heat.cellDeaths')}`;
  };
  canvas.onmouseleave = () => {
    xv.style.display = xh.style.display = tip.style.display = 'none';
  };
}

(async () => {
  const data = await api('/api/wipes');
  const sel = document.getElementById('wipe-select');
  for (const w of data.rows) {
    const opt = document.createElement('option');
    opt.value = w.id;
    const date = new Date(w.started_at * 1000).toLocaleDateString(LOCALE, { day: '2-digit', month: 'short' });
    opt.textContent = `${w.label || t('stats.wipeWord')} (${date})${w.id === data.current ? ` — ${t('sum.current')}` : ''}`;
    sel.appendChild(opt);
  }
  sel.value = data.current;
  sel.addEventListener('change', () => load(sel.value));
  await load(sel.value);
})().catch(console.error);
</script>
</body>
</html>
