<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-key="sum.title">Wipe Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header></header>

<main>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px">
    <h2 class="section" style="margin:0" data-i18n="sum.title">🏁 Wipe recap</h2>
    <select id="wipe-select" style="width:auto;border-radius:999px;padding:7px 14px;font-size:13px"></select>
  </div>
  <p style="color:var(--ink-muted);font-size:13px;margin-top:6px" id="wipe-meta"></p>

  <div class="grid cols-3" id="highlights" style="margin-top:18px" data-i18n="loading">loading…</div>
</main>

<footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
async function load(wipeId) {
  const s = await api(`/api/wipesummary${wipeId ? `?wipe=${wipeId}` : ''}`);

  document.getElementById('wipe-meta').textContent =
    t('sum.meta', s.wipe.label || t('stats.wipeWord'), fmtDate(s.wipe.startedAt)) +
    `${s.wipe.mapSeed ? ` · seed ${s.wipe.mapSeed}` : ''}${s.wipe.mapSize ? ` · map ${s.wipe.mapSize}` : ''}` +
    ` · ${t('sum.metaKills', fmtNum(s.totals?.kills || 0), s.totals?.killers || 0)}`;

  const card = (icon, title, who, detail) => who ? `
    <div class="card" style="text-align:center;padding:26px">
      <div style="font-size:34px">${icon}</div>
      <div style="color:var(--ink-muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;margin:6px 0">${title}</div>
      <div style="font-size:18px;font-weight:700">${playerLink(who.steam_id, who.name)}</div>
      <div style="color:var(--accent);font-size:14px;margin-top:4px">${detail}</div>
    </div>` : '';

  document.getElementById('highlights').innerHTML = [
    card('⚔️', t('sum.topKiller'), s.topKiller, t('sum.kills', s.topKiller?.n)),
    card('🦅', t('sum.bestElo'), s.topElo, `${s.topElo?.rating} (${esc(s.topElo?.tier || '')})`),
    card('🎯', t('sum.longest'), s.longestKill, `${Math.round(s.longestKill?.distance || 0)} m · ${esc(s.longestKill?.weapon || '')}`),
    card('🎖️', t('sum.headshots'), s.topHeadshots, `${s.topHeadshots?.n} headshots`),
    card('🌾', t('sum.farmer'), s.topFarmer, t('sum.resources', fmtNum(s.topFarmer?.n || 0))),
    card('⏱️', t('sum.hours'), s.topHours, t('sum.hoursVal', Math.round((s.topHours?.seconds || 0) / 3600))),
    card('🧲', t('sum.punchbag'), s.topDeaths, t('sum.deaths', s.topDeaths?.n)),
    card('🚁', t('sum.heli'), s.topHeli, t('sum.helis', s.topHeli?.n)),
  ].filter(Boolean).join('') ||
  `<p style="color:var(--ink-muted)">${t('sum.noData')}</p>`;
}

(async () => {
  const data = await api('/api/wipes');
  const sel = document.getElementById('wipe-select');
  for (const w of data.rows) {
    const opt = document.createElement('option');
    opt.value = w.id;
    const date = new Date(w.started_at * 1000).toLocaleDateString(LOCALE, { day: '2-digit', month: 'short' });
    opt.textContent = `${w.label || t('stats.wipeWord')} (${date})${w.id === data.current ? ` — ${t('sum.current')}` : ''}`;
    sel.appendChild(opt);
  }
  const urlWipe = new URLSearchParams(location.search).get('wipe');
  sel.value = urlWipe || data.current;
  sel.addEventListener('change', () => load(sel.value));
  await load(sel.value);
})().catch(console.error);
</script>
</body>
</html>
