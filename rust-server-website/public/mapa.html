<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-key="map.title">Map Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header></header>

<main>
  <h2 class="section" style="margin-top:6px" data-i18n="map.title">Next map vote</h2>

  <div class="card">
    <h3 data-i18n="map.how">How it works</h3>
    <p style="color:var(--ink-2);font-size:14px" data-i18n="map.howDesc">
      Before every wipe, the community picks the map. Your vote is worth more the more you play:
      <b style="color:var(--accent)">1 base vote + 1 per 10 hours played last wipe (max 5)</b>.
      The people who build the server decide the server. You can change your vote while voting is open.
    </p>
  </div>

  <div id="state-banner"></div>
  <div class="grid cols-3" id="options" style="margin-top:16px" data-i18n="loading">loading…</div>
</main>

<footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
async function load() {
  const [state, user] = await Promise.all([api('/api/mapvote'), me()]);
  const banner = document.getElementById('state-banner');

  if (!state.open) {
    banner.innerHTML = `<div class="notice err" style="margin-top:16px">${t('map.closed')}</div>`;
  } else if (!user.loggedIn) {
    banner.innerHTML = `<div class="notice err" style="margin-top:16px">${t('map.login')}</div>`;
  } else {
    banner.innerHTML = `<div class="notice ok" style="margin-top:16px">
      ${t('map.open', state.myWeight)}
      ${state.myWeight > 1 ? t('map.thanks') : t('map.playMore')}.
      ${state.myVote ? t('map.changed') : ''}</div>`;
  }

  const total = state.options.reduce((s, o) => s + o.votes, 0) || 1;
  document.getElementById('options').innerHTML = state.options.map((o) => `
    <div class="card map-option ${state.myVote === o.id ? 'voted' : ''}">
      <b style="font-size:15.5px">${esc(o.label)}</b>
      <p style="color:var(--ink-muted);font-size:12.5px;margin:4px 0 2px">
        ${o.seed ? t('map.seed', esc(o.seed)) : ''} ${o.size ? `· ${o.size}` : ''}
        ${o.seed && o.size ? `· <a href="https://rustmaps.com/map/${o.size}_${esc(o.seed)}" target="_blank" rel="noopener">${t('map.viewMap')}</a>` : ''}
      </p>
      <div class="vote-bar"><div style="width:${Math.round((o.votes / total) * 100)}%"></div></div>
      <p style="color:var(--ink-2);font-size:13px;margin:6px 0 12px">${t('map.points', o.votes, o.voters)}</p>
      ${state.open ? `<button class="btn ${state.myVote === o.id ? '' : 'ghost'}" data-id="${o.id}">
        ${state.myVote === o.id ? t('map.yourVote') : t('map.voteThis')}</button>` : ''}
    </div>`).join('') ||
    `<p style="color:var(--ink-muted)">${t('map.noOptions')}</p>`;
}

document.getElementById('options').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  try {
    await apiPost('/api/mapvote/vote', { optionId: parseInt(b.dataset.id, 10) });
    load();
  } catch (err) { alert('⚠️ ' + err.message); }
});

load().catch(console.error);
</script>
</body>
</html>
