<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='0,0 50,0 64,14 64,64 0,64' fill='%23ff5b26'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230b0d11'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ---- ops console ---- */
.ad-wrap { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 22px; align-items: start; }
.ad-side {
  position: sticky; top: 84px; background: var(--surface); border: 1px solid var(--line);
  padding: 0 0 10px; box-shadow: var(--shadow);
}
.ad-side::before {
  content: ""; display: block; height: 3px;
  background: repeating-linear-gradient(-55deg, var(--accent) 0 10px, transparent 10px 20px); opacity: .5;
}
.ad-brand {
  font-family: var(--font-stencil); font-size: 19px; letter-spacing: 1px;
  padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
}
.ad-brand b { color: var(--accent); font-weight: 400; }
.ad-group {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.5px;
  color: var(--ink-muted); text-transform: uppercase; padding: 14px 16px 5px;
}
.ad-item {
  display: flex; gap: 10px; align-items: center; padding: 8px 14px;
  font-family: var(--font-display); font-weight: 600; font-size: 14.5px; letter-spacing: .6px;
  color: var(--ink-2); cursor: pointer; border-left: 2px solid transparent; user-select: none;
}
.ad-item:hover { color: var(--ink); background: var(--surface-2); }
.ad-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
.ad-item .i { width: 20px; text-align: center; font-size: 14px; }
.ad-item .cnt {
  margin-left: auto; min-width: 20px; text-align: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  color: #0b0d11; background: var(--ember); padding: 1px 6px;
}
.ad-item .cnt.hot { background: var(--bad); color: #fff; }
.ad-item .cnt:empty { display: none; }
.ad-foot { border-top: 1px solid var(--line); margin-top: 10px; padding: 10px 16px 2px; display: flex; gap: 14px; }
.ad-foot a { font-size: 12px; color: var(--ink-muted); cursor: pointer; }
.ad-foot a:hover { color: var(--accent); }
.ad-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.ad-head h2 {
  font-family: var(--font-display); font-weight: 800; font-size: 24px;
  letter-spacing: 2px; text-transform: uppercase;
}
.ad-head .desc { color: var(--ink-muted); font-size: 12.5px; }
.ad-head .refresh { margin-left: auto; font-size: 12.5px; color: var(--ink-muted); cursor: pointer; }
.ad-head .refresh:hover { color: var(--accent); }

/* overview: mural "precisa de atenção" */
.ov-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .ov-grid { grid-template-columns: 1fr 1fr; } }
.ov-tile {
  background: var(--surface); border: 1px solid var(--line); clip-path: var(--chamfer);
  padding: 16px 18px 14px; cursor: pointer; position: relative; transition: border-color .13s ease;
}
.ov-tile::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc, var(--line-2)); }
.ov-tile:hover { border-color: var(--line-2); }
.ov-tile .n { font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: 1; color: var(--tc, var(--ink)); }
.ov-tile .l { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--ink-muted); margin-top: 7px; }
.ov-tile .s { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.ov-tile.ok { --tc: var(--live); }
.ov-tile.warn { --tc: var(--ember); }
.ov-tile.hot { --tc: var(--bad); }

/* composer: formulário de criação com cabeçalho próprio */
.composer {
  background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--accent);
  padding: 18px 20px 16px; margin-bottom: 18px; box-shadow: var(--shadow);
}
.composer .c-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.composer .c-head b {
  font-family: var(--font-display); font-weight: 800; font-size: 14px;
  letter-spacing: 1.5px; text-transform: uppercase;
}
.composer .c-head .sub { font-size: 12px; color: var(--ink-muted); }
.field .count { line-height: 1; }

@media (max-width: 900px) {
  .ad-wrap { grid-template-columns: 1fr; }
  .ad-side { position: static; display: flex; flex-wrap: wrap; padding: 6px; }
  .ad-brand, .ad-group, .ad-foot { display: none; }
  .ad-item { border-left: 0; border-bottom: 2px solid transparent; }
  .ad-item.active { border-bottom-color: var(--accent); }
}
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a class="logo" href="/"><b data-brand></b> <span style="font-size:13px;color:var(--ink-muted);letter-spacing:0">admin</span></a>
    <div class="links"><a href="/">← back to site</a></div>
  </nav>
</header>

<main>
  <div id="login-card" style="max-width:440px;margin:70px auto 0">
    <div class="card" style="padding:30px;border-top:3px solid var(--accent)">
      <h2 style="font-family:var(--font-stencil);font-size:26px;letter-spacing:2px">OPS<span style="color:var(--accent)">/</span>CONSOLE</h2>
      <p style="color:var(--ink-muted);font-size:13px;margin:8px 0 16px">Full control room. The key lives in <code>server/config.json</code> (adminKey) — never share it.</p>
      <input type="password" id="admin-key" placeholder="adminKey…" autocomplete="off">
      <button class="btn" style="margin-top:12px;width:100%" id="load-btn">Unlock</button>
    </div>
  </div>

  <div id="panel" class="ad-wrap" style="display:none;margin-top:6px">
    <aside class="ad-side" id="ad-side">
      <div class="ad-brand"><b>R</b>//OPS</div>
      <div class="ad-item" data-s="overview"><span class="i">⌂</span>Overview<b class="cnt" id="cnt-total"></b></div>
      <div class="ad-group">Moderation</div>
      <div class="ad-item" data-s="reports"><span class="i">🚨</span>Reports<b class="cnt hot" data-cnt="reportsPriority"></b></div>
      <div class="ad-item" data-s="watch"><span class="i">🎯</span>Watchlist<b class="cnt hot" data-cnt="watchHigh"></b></div>
      <div class="ad-item" data-s="ow"><span class="i">🕵️</span>Overwatch<b class="cnt" data-cnt="owOpen"></b></div>
      <div class="ad-item" data-s="bans"><span class="i">🔨</span>Bans</div>
      <div class="ad-group">Community</div>
      <div class="ad-item" data-s="apps"><span class="i">📋</span>Applications<b class="cnt" data-cnt="appsPending"></b></div>
      <div class="ad-item" data-s="appeals"><span class="i">⚖️</span>Appeals<b class="cnt" data-cnt="appealsPending"></b></div>
      <div class="ad-item" data-s="team"><span class="i">👥</span>Team</div>
      <div class="ad-group">Operations</div>
      <div class="ad-item" data-s="redemptions"><span class="i">💎</span>Deliveries<b class="cnt" data-cnt="redemptionsPending"></b></div>
      <div class="ad-item" data-s="map"><span class="i">🗺️</span>Map vote</div>
      <div class="ad-item" data-s="posts"><span class="i">📰</span>News</div>
      <div class="ad-foot"><a href="/">← site</a><a id="lock-btn">🔒 lock</a></div>
    </aside>
    <section style="min-width:0">
      <div class="ad-head">
        <h2 id="sec-title">Overview</h2>
        <span class="desc" id="sec-desc"></span>
        <span class="refresh" id="sec-refresh">↻ refresh</span>
      </div>
      <div id="section-body" style="margin-top:12px"></div>
    </section>
  </div>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
let KEY = sessionStorage.getItem('adminKey') || '';
let SECTION = 'overview';

const H = () => ({ 'X-Admin-Key': KEY });
const aGet = (p) => fetch(p, { headers: H() }).then((r) => {
  if (!r.ok) { const err = new Error(r.status); err.status = r.status; throw err; }
  return r.json();
});
const aPost = (p, b) => apiPost(p, b, H());
const body = () => document.getElementById('section-body');
const badge = (s) => `<span class="badge ${esc(s)}">${esc(s)}</span>`;
const statusButtons = (kind, id, current, statuses) => `
  <div class="tabs" style="margin:10px 0 0">
    ${statuses.map((s) => `<button data-kind="${kind}" data-id="${id}" data-status="${s}" ${s === current ? 'class="active"' : ''}>${s}</button>`).join('')}
  </div>`;

// ---------- secções ----------

async function renderApps() {
  const { rows } = await aGet('/api/admin/applications');
  body().innerHTML = rows.map((a) => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b style="font-size:16px">${esc(a.name)}</b>
        <span style="color:var(--ink-muted);font-size:13px">${esc(a.discord)} · ${esc(a.steam_id)} · ${a.age ?? '?'} yrs · ${a.hours_played ?? '?'}h · ${esc(a.timezone || '—')}</span>
        <span style="margin-left:auto">${badge(a.status)}</span>
      </div>
      <div style="color:var(--ink-muted);font-size:12px;margin:4px 0 8px">${new Date(a.ts * 1000).toLocaleString('en-GB')} · availability: ${esc(a.availability || '—')}</div>
      <details><summary style="cursor:pointer;color:var(--accent);font-size:13px">full answers</summary>
        <div class="prose" style="margin-top:10px;font-size:13.5px">
          <p><b>Experience:</b> ${esc(a.experience || '—')}</p>
          <p><b>Motivation:</b> ${esc(a.motivation || '—')}</p>
          <p><b>Scenario 1 (suspected clan, no proof):</b> ${esc(a.scenario1 || '—')}</p>
          <p><b>Scenario 2 (accused friend):</b> ${esc(a.scenario2 || '—')}</p>
          <p><b>Scenario 3 (accused of admin abuse):</b> ${esc(a.scenario3 || '—')}</p>
        </div>
      </details>
      ${statusButtons('app', a.id, a.status, ['pending', 'reviewing', 'interview', 'approved', 'rejected'])}
    </div>`).join('') || '<p style="color:var(--ink-muted)">No applications.</p>';
}

async function renderAppeals() {
  const { rows } = await aGet('/api/admin/appeals');
  body().innerHTML = rows.map((a) => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(a.player_name || a.steam_id)}</b>
        <span style="color:var(--ink-muted);font-size:13px">${esc(a.discord || 'no discord')} · ${timeAgo(a.ts)}</span>
        <span style="margin-left:auto">${badge(a.status)}</span>
      </div>
      <p style="color:var(--ink-2);font-size:13.5px;margin-top:8px">${esc(a.text)}</p>
      ${a.response ? `<p style="margin-top:8px;font-size:13px"><b>Reply:</b> ${esc(a.response)}</p>` : ''}
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="text" data-response-for="${a.id}" placeholder="reply to the player…" style="flex:1;min-width:220px">
      </div>
      ${statusButtons('appeal', a.id, a.status, ['pending', 'reviewing', 'accepted', 'rejected'])}
    </div>`).join('') || '<p style="color:var(--ink-muted)">No appeals.</p>';
}

async function renderRedemptions() {
  const { rows } = await aGet('/api/admin/redemptions');
  body().innerHTML = `
    <p style="color:var(--ink-muted);font-size:13px;margin-bottom:10px">
      Redemptions with a command are delivered automatically by the plugin ("sent" → "delivered").
      The rest are delivered manually in-game and marked here.</p>` +
    (rows.map((r) => `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(r.item_name || r.item_id)}</b>
        <span style="color:var(--ink-muted);font-size:13px">${esc(r.player_name || r.steam_id)} · ${r.cost.toLocaleString('en-GB')} 💎 · ${timeAgo(r.ts)}</span>
        <span style="margin-left:auto">${badge(r.status)}</span>
      </div>
      ${r.command ? `<code style="font-size:12px;color:var(--ink-muted)">${esc(r.command)}</code>` : '<span style="font-size:12px;color:var(--gold)">manual delivery</span>'}
      ${statusButtons('redemption', r.id, r.status, ['pending', 'sent', 'delivered', 'failed'])}
    </div>`).join('') || '<p style="color:var(--ink-muted)">No redemptions.</p>');
}

async function renderOw() {
  const { rows, clipBytes } = await aGet('/api/admin/owcases');
  body().innerHTML = `
    <p style="color:var(--ink-muted);font-size:12.5px;margin-bottom:10px">
      📼 Hosted clips on disk: <b>${((clipBytes || 0) / 1048576).toFixed(1)} MB</b>
      — clips are deleted automatically when a case closes (unless you keep them for the hall of shame).</p>` + `
    <form id="ow-form" class="composer">
      <div class="c-head"><b>🕵️ New case</b>
        <span class="sub">the community votes blind — never put player names in the title</span></div>
      <div class="form-grid">
        <div class="field full"><label>Title (no player names!) <span class="count"></span></label>
          <input name="title" required maxlength="120" placeholder="e.g. Case #14 — AK spray, 180 m"></div>
        <div class="field"><label>Clip URL (YouTube/Streamable)</label>
          <input name="clipUrl" maxlength="300" placeholder="leave empty if uploading a file"></div>
        <div class="field"><label>…or upload the clip (MP4/WebM, 200 MB max)</label>
          <input type="file" name="clipFile" accept="video/mp4,video/webm">
          <p class="hint">Hosted clips play directly on the site and are <b>deleted automatically</b> when you close the case — no disk build-up.</p>
        </div>
      </div>
      <div class="form-foot">
        <span class="hint">Appears on the public <a href="/overwatch" target="_blank">Overwatch page</a> for community verdicts.</span>
        <button class="btn">Publish case</button>
      </div>
    </form>` +
    rows.map((c) => `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(c.title)}</b> ${badge(c.status)}
        ${c.clip_url ? `<a href="${esc(c.clip_url)}" target="_blank" rel="noopener" style="font-size:13px">🎬 clip</a>` : ''}
        ${c.clip_file ? `<a href="/clips/${esc(c.clip_file)}" target="_blank" style="font-size:13px">📼 hosted clip</a>` : ''}
        ${!c.clip_url && !c.clip_file ? '<span style="font-size:12px;color:var(--ink-muted)">clip deleted</span>' : ''}
        <span style="margin-left:auto;font-size:13px;color:var(--ink-2)">
          🚨 ${c.tally.cheat} · 🤔 ${c.tally.unsure} · ✅ ${c.tally.clean}</span>
      </div>
      ${c.status === 'open' ? `
        <div class="tabs" style="margin-top:10px">
          ${['cheater', 'innocent', 'inconclusive'].map((v) =>
            `<button data-close-ow="${c.id}" data-verdict="${v}">close: ${v}</button>`).join('')}
          ${c.clip_file ? `<button data-close-ow="${c.id}" data-verdict="cheater" data-keep="1">close: cheater · keep clip 🎬</button>` : ''}
        </div>` : `<p style="font-size:13px;margin-top:6px">Verdict: <b>${esc(c.verdict)}</b></p>`}
    </div>`).join('');

  wireCounts(document.getElementById('ow-form'));
  document.getElementById('ow-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button.btn');
    const fd = new FormData(e.target);
    const file = fd.get('clipFile');
    const data = { title: fd.get('title'), clipUrl: fd.get('clipUrl') };
    if (!data.clipUrl && !(file && file.size)) { alert('Give a clip URL or upload a file.'); return; }
    btn.disabled = true;
    try {
      if (file && file.size) {
        btn.textContent = 'Uploading… (keep this tab open)';
        // corpo = ficheiro em bruto; o servidor grava em streaming para o disco
        const r = await fetch('/api/admin/owclip', {
          method: 'POST',
          headers: { ...H(), 'Content-Type': file.type || 'video/mp4' },
          body: file,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || `Upload failed (${r.status})`);
        data.clipFile = d.file;
      }
      await aPost('/api/admin/owcases', data);
      renderOw();
    } catch (err) {
      alert('⚠️ ' + err.message);
      btn.disabled = false; btn.textContent = 'Publish case';
    }
  });
}

async function renderBans() {
  const { rows } = await aGet('/api/admin/bans');
  body().innerHTML = `

    <form id="ban-form" class="composer">
      <div class="c-head"><b>🔨 Record a ban</b>
        <span class="sub">publish only the in-game name — never personal data</span></div>
      <div class="form-grid">
        <div class="field"><label>Player name *</label><input name="steamName" required maxlength="64" placeholder="in-game name"></div>
        <div class="field"><label>Responsible admin *</label><input name="staffName" required maxlength="64" placeholder="who pulled the trigger"></div>
        <div class="field full"><label>Reason * <span class="count"></span></label>
          <input name="reason" required maxlength="300" placeholder="e.g.: Confirmed aimbot (recording published)"></div>
        <div class="field"><label>Evidence link</label><input name="evidence" maxlength="300" placeholder="https://youtu.be/…"></div>
        <div class="field"><label>SteamID64</label><input name="steamId" maxlength="20" placeholder="7656119…">
          <p class="hint">With the SteamID, everyone who reported this player gets an automatic in-game thank-you + gem bounty.</p></div>
      </div>
      <div class="form-foot">
        <span class="hint">Goes live on the public <a href="/staff" target="_blank">transparency page</a> and fires the Discord <b>#ban-log</b> embed.</span>
        <button class="btn">Record ban</button>
      </div>
    </form>` +
    rows.map((b) => `
      <div class="card" style="margin-bottom:8px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(b.steam_name)}</b>
        <span style="color:var(--ink-2);font-size:13.5px">${esc(b.reason)}</span>
        <span style="color:var(--ink-muted);font-size:12.5px">${esc(b.staff_name)} · ${timeAgo(b.ts)}</span>
        ${b.evidence ? `<a href="${esc(b.evidence)}" target="_blank" rel="noopener" style="font-size:13px">🎬 evidence</a>` : ''}
        <button class="btn ghost" data-del-ban="${b.id}" style="margin-left:auto;padding:4px 12px;font-size:12px">remove</button>
      </div>`).join('');

  const banForm = document.getElementById('ban-form');
  wireCounts(banForm);
  banForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = banForm.querySelector('.btn');
    btn.disabled = true; btn.textContent = 'Recording…';
    try {
      await aPost('/api/admin/bans', Object.fromEntries(new FormData(banForm).entries()));
      renderBans();
    } catch (err) {
      alert('⚠️ ' + err.message);
      btn.disabled = false; btn.textContent = 'Record ban';
    }
  });
}

async function renderMap() {
  const state = await api('/api/mapvote');
  body().innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b>Round ${state.round}</b> ${badge(state.open ? 'open' : 'closed')}
        <button class="btn ghost" data-map-action="${state.open ? 'close' : 'open'}">${state.open ? 'Close voting' : 'Open voting'}</button>
        <button class="btn ghost" data-map-action="new_round">New round (clears options)</button>
      </div>
    </div>
    <form id="map-form" class="composer">
      <div class="c-head"><b>🗺️ Add candidate map</b>
        <span class="sub">preview seeds on rustmaps.com before adding</span></div>
      <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr">
        <div class="field"><label>Name/description</label><input name="label" required maxlength="80" placeholder="Map A — classic, 2 lakes"></div>
        <div class="field"><label>Seed</label><input name="seed" maxlength="20" placeholder="1847395"></div>
        <div class="field"><label>Size</label><input name="size" type="number" min="1000" max="6000" placeholder="3800"></div>
      </div>
      <div class="form-foot">
        <span class="hint">Players rank the candidates on the public <a href="/mapa" target="_blank">map page</a> while voting is open.</span>
        <button class="btn">Add map</button>
      </div>
    </form>` +
    state.options.map((o) => `
      <div class="card" style="margin-bottom:8px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(o.label)}</b>
        <span style="color:var(--ink-muted);font-size:13px">seed ${esc(o.seed || '—')} · ${o.size || '—'}</span>
        <span style="margin-left:auto;font-size:13px"><b>${o.votes}</b> points (${o.voters} voters)</span>
      </div>`).join('');

  document.getElementById('map-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn');
    btn.disabled = true;
    const d = Object.fromEntries(new FormData(e.target).entries());
    try {
      await aPost('/api/admin/mapvote', { action: 'add', label: d.label, seed: d.seed, size: parseInt(d.size, 10) || null });
      renderMap();
    } catch (err) { alert('⚠️ ' + err.message); btn.disabled = false; }
  });
}

async function renderPosts() {
  const { rows } = await api('/api/posts');
  body().innerHTML = `
    <form id="post-form" class="composer">
      <div class="c-head"><b>✍️ Compose</b>
        <span class="sub">goes live instantly on the public News page — write like a changelog entry</span></div>
      <div class="field"><label>Title <span class="count"></span></label>
        <input name="title" required maxlength="120" placeholder="e.g. Sept 3rd force wipe — new map chosen by vote"></div>
      <div class="field" style="margin-top:12px"><label>Body <span class="count"></span></label>
        <textarea name="body" required maxlength="8000" style="min-height:240px"
          placeholder="What changed, when, and what players should do about it. Plain text — line breaks are kept."></textarea></div>
      <div class="form-foot">
        <span class="hint">Publishes on <a href="/novidades" target="_blank">/novidades</a> and posts to Discord <b>#announcements</b>.</span>
        <button class="btn">Publish</button>
      </div>
    </form>
    <div style="display:flex;align-items:baseline;gap:10px;margin:4px 0 10px">
      <b style="font-family:var(--font-display);letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--ink-2)">Published</b>
      <span style="font-size:12px;color:var(--ink-muted)">${rows.length} post${rows.length === 1 ? '' : 's'}</span>
    </div>` +
    (rows.map((p) => `
      <div class="card post" style="margin-bottom:10px">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
          <h3 style="margin:0">${esc(p.title)}</h3>
          <span style="color:var(--ink-muted);font-size:12px">${fmtDate(p.ts)}</span>
          <button class="btn ghost" data-del-post="${p.id}" style="margin-left:auto;padding:4px 12px;font-size:12px">delete</button>
        </div>
        <p style="margin-top:8px;white-space:pre-line">${esc(p.body)}</p>
      </div>`).join('') || '<p style="color:var(--ink-muted)">Nothing published yet.</p>');

  const form = document.getElementById('post-form');
  wireCounts(form);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('.btn');
    btn.disabled = true; btn.textContent = 'Publishing…';
    try {
      await aPost('/api/admin/posts', Object.fromEntries(new FormData(form).entries()));
      renderPosts();
    } catch (err) { alert('⚠️ ' + err.message); btn.disabled = false; btn.textContent = 'Publish'; }
  });
}

async function renderTeam() {
  const { rows } = await aGet('/api/admin/roles');
  body().innerHTML = `
    <p style="color:var(--ink-muted);font-size:13px;margin-bottom:12px">
      Site roles. Mods see the <b>MOD</b> nav link, the staff chat, /mod (watchlist + reports)
      and can delete chat messages. They do NOT get this admin panel — that stays adminKey-only.</p>
    <form id="role-form" class="composer">
      <div class="c-head"><b>👥 Grant a site role</b>
        <span class="sub">the player must log in with Steam at least once to show a name</span></div>
      <div class="form-grid" style="grid-template-columns:2fr 1fr">
        <div class="field"><label>SteamID64 *</label><input name="steamId" required maxlength="20" placeholder="7656119…"></div>
        <div class="field"><label>Role</label>
          <select name="role"><option value="mod">mod</option><option value="admin">admin</option></select></div>
      </div>
      <div class="form-foot">
        <span class="hint">Unlocks /mod, staff chat and chat moderation — <b>not</b> this admin panel (adminKey only).</span>
        <button class="btn">Add / update</button>
      </div>
    </form>` +
    (rows.map((r) => `
    <div class="card" style="margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      ${pfp(r.avatar, r.name, 26)}
      <b>${esc(r.name || r.steam_id)}</b>
      <span class="rolechip">${esc(r.role.toUpperCase())}</span>
      <span style="font-size:12px;color:var(--ink-muted)">${esc(r.steam_id)}</span>

  document.getElementById('role-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn');
    btn.disabled = true;

      await aPost('/api/admin/roles', Object.fromEntries(new FormData(e.target).entries()));
      renderTeam();

  });
  body().querySelectorAll('[data-remove-role]').forEach((a) => a.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await aPost('/api/admin/roles', { steamId: a.dataset.removeRole, action: 'remove' });
      renderTeam();
    } catch (err) { alert('⚠️ ' + err.message); }
  }));
}

async function renderReports() {
  const { rows } = await aGet('/api/admin/reports');
  body().innerHTML = `
    <p style="color:var(--ink-muted);font-size:13px;margin-bottom:12px">
      In-game F7 reports, grouped by target. <b style="color:var(--bad)">Red</b> = 3+ different
      players reported them in the last 24 h — spectate priority. Reports are one more signal,
      never proof by themselves.</p>` +
    (rows.map((r) => `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        ${pfp(r.avatar, r.name, 30)}
        <b>${esc(r.name || r.target_id)}</b>
        ${r.reporters24h >= 3 ? '<span class="badge failed">PRIORITY</span>' : ''}
        <span style="font-size:13px;color:var(--ink-2)">
          ${r.reporters24h} reporter(s) / 24h · ${r.total} report(s) total · last ${timeAgo(r.last_ts)}</span>
        <span style="margin-left:auto;display:flex;gap:10px">
          <a href="/player?id=${encodeURIComponent(r.target_id)}" target="_blank" style="font-size:13px">profile ↗</a>
          <a href="#" data-expand="${esc(r.target_id)}" style="font-size:13px">details ▾</a>
        </span>
      </div>
      <div id="rep-${esc(r.target_id)}" style="display:none;margin-top:10px"></div>
    </div>`).join('') || '<p style="color:var(--ink-muted)">No reports yet. 🎉</p>');

  body().querySelectorAll('[data-expand]').forEach((a) => a.addEventListener('click', async (e) => {
    e.preventDefault();
    const id = a.dataset.expand;
    const box = document.getElementById(`rep-${id}`);
    if (box.style.display !== 'none') { box.style.display = 'none'; return; }
    box.style.display = '';
    box.innerHTML = '<p style="color:var(--ink-muted);font-size:13px">loading…</p>';
    let list;
    try { ({ rows: list } = await aGet(`/api/admin/reports?target=${encodeURIComponent(id)}`)); }
    catch (err) { box.innerHTML = `<p style="color:var(--bad);font-size:13px">Error: ${esc(err.message)}</p>`; return; }
    box.innerHTML = list.map((x) => `
      <div style="border-left:2px solid var(--line-2);padding:6px 12px;margin:6px 0;font-size:13px">
        <b>${esc(x.reporter_name || x.reporter_id)}</b>
        <span style="color:var(--ink-muted)">· ${esc(x.rtype || 'report')} · ${timeAgo(x.ts)}</span><br>
        ${x.subject ? `<b style="color:var(--ink-2)">${esc(x.subject)}</b> — ` : ''}${esc(x.message || '')}
      </div>`).join('');
  }));
}

async function renderWatchlist() {
  const { rows } = await aGet('/api/admin/watchlist');
  body().innerHTML = `
    <p style="color:var(--ink-muted);font-size:13px;margin-bottom:12px">
      Automatic risk radar for this wipe (10+ kills). Ranks who deserves spectate first —
      it never bans anyone. Signals: headshot rate, long-range kills, kill bursts,
      kills per hour played, report pressure and Steam ban history
      (Steam bans need <code>steamApiKey</code> in config.json).</p>` +
    (rows.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Risk</th><th>Player</th><th class="num">Kills</th><th class="num">HS%</th>
      <th class="num">Aim</th><th class="num">Longest</th><th class="num">Hours</th><th>Signals</th></tr></thead>
      <tbody>${rows.map((r) => `
        <tr>
          <td><b style="color:${r.score >= 60 ? 'var(--bad)' : r.score >= 35 ? 'var(--ember)' : 'var(--ink-2)'};font-family:var(--font-display);font-size:18px">${r.score}</b></td>
          <td>${pfp(r.avatar, r.name, 24)} <a href="/player?id=${encodeURIComponent(r.steamId)}" target="_blank" ${r.aliases && r.aliases.length ? `title="also known as: ${esc(r.aliases.join(', '))}"` : ''}>${esc(r.name)}</a>${r.aliases && r.aliases.length ? ' <span style="color:var(--ink-muted);font-size:11px">aka</span>' : ''}</td>
          <td class="num">${r.kills}</td>
          <td class="num">${r.hsRate}%</td>
          <td class="num">${r.aim ? `${r.aim.accPct}% <span style="color:var(--ink-muted);font-size:11px">of ${fmtNum(r.aim.shots)}</span>` : '—'}</td>
          <td class="num">${r.maxDistance}m</td>
          <td class="num">${r.hours}</td>
          <td style="white-space:normal;font-size:12px;color:var(--ink-2)">${r.reasons.map(esc).join(' · ')}</td>
        </tr>`).join('')}</tbody>
    </table></div>` : '<p style="color:var(--ink-muted)">Nobody trips the radar right now. 🕊️</p>');

// ---------- overview: o mural do que precisa de atenção ----------

const TILE_DEFS = [
  { key: 'reportsPriority', s: 'reports', hot: true, label: 'priority reports', okText: 'no report pressure' },
  { key: 'watchHigh', s: 'watch', hot: true, label: 'high-risk players', okText: 'radar quiet' },
  { key: 'appsPending', s: 'apps', label: 'applications waiting', okText: 'inbox zero' },
  { key: 'appealsPending', s: 'appeals', label: 'appeals waiting', okText: 'all answered' },
  { key: 'redemptionsPending', s: 'redemptions', label: 'deliveries pending', okText: 'all delivered' },
  { key: 'owOpen', s: 'ow', label: 'overwatch cases open', okText: 'no open cases' },
];

async function renderOverview() {
  const [sum, staffData] = await Promise.all([
    aGet('/api/admin/summary'),
    api('/api/staff').catch(() => null),
  ]);
  const tiles = TILE_DEFS.map((t) => {
    const n = sum[t.key] || 0;
    const cls = n === 0 ? 'ok' : (t.hot ? 'hot' : 'warn');
    return `<div class="ov-tile ${cls}" data-goto="${t.s}">
      <div class="n">${n}</div>
      <div class="l">${t.label}</div>
      <div class="s">${n === 0 ? '✓ ' + t.okText : 'click to handle →'}</div>
    </div>`;
  }).join('');
  const ms = staffData?.modStats;
  body().innerHTML = `
    <div class="ov-grid">${tiles}</div>
    ${ms ? `<h3 style="font-family:var(--font-display);letter-spacing:1.5px;text-transform:uppercase;font-size:15px;color:var(--ink-2);margin:24px 0 10px">This wipe's receipts (public)</h3>
    <div class="ov-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="ov-tile" style="cursor:default"><div class="n">${ms.bans}</div><div class="l">cheaters banned</div></div>
      <div class="ov-tile" style="cursor:default"><div class="n">${ms.reports}</div><div class="l">F7 reports processed</div></div>
      <div class="ov-tile" style="cursor:default"><div class="n">${ms.appealsAnswered}</div><div class="l">appeals answered</div></div>
      <div class="ov-tile" style="cursor:default"><div class="n">${ms.owClosed}</div><div class="l">overwatch verdicts</div></div>
    </div>` : ''}`;
  body().querySelectorAll('[data-goto]').forEach((el) =>
    el.addEventListener('click', () => show(el.dataset.goto)));
}

// ---------- badges da sidebar ----------

async function updateBadges() {
  try {
    const sum = await aGet('/api/admin/summary');
    let total = 0;
    document.querySelectorAll('[data-cnt]').forEach((el) => {
      const n = sum[el.dataset.cnt] || 0;
      total += n;
      el.textContent = n > 0 ? n : '';
    });
    const t = document.getElementById('cnt-total');
    t.textContent = total > 0 ? total : '';
    t.classList.toggle('hot', (sum.reportsPriority || 0) + (sum.watchHigh || 0) > 0);
  } catch {}
}

// contador de caracteres em campos com maxlength + <span class="count">
function wireCounts(form) {
  form.querySelectorAll('.field [maxlength]').forEach((el) => {
    const c = el.closest('.field')?.querySelector('.count');
    if (!c) return;
    const upd = () => {
      c.textContent = `${el.value.length}/${el.maxLength}`;
      c.classList.toggle('warn', el.value.length > el.maxLength * 0.9);
    };
    el.addEventListener('input', upd);
    upd();
  });
}

const SECTIONS = { overview: renderOverview, apps: renderApps, reports: renderReports, watch: renderWatchlist, team: renderTeam, appeals: renderAppeals, redemptions: renderRedemptions, ow: renderOw, bans: renderBans, map: renderMap, posts: renderPosts };

const SECTION_META = {
  overview: ['Overview', 'what needs your attention right now'],
  reports: ['Reports', 'F7 reports grouped by target — red means spectate priority'],
  watch: ['Watchlist', 'automatic risk radar — never bans, only ranks who to watch'],
  ow: ['Overwatch', 'community verdict cases and hosted clips'],
  bans: ['Bans', 'feeds the public transparency page + Discord'],
  apps: ['Applications', 'moderator candidates'],
  appeals: ['Appeals', 'answered by a different admin than the one who banned'],
  team: ['Team', 'site roles: mods get /mod, staff chat and the MOD nav link'],
  redemptions: ['Deliveries', 'gem store redemptions — auto via plugin, manual marked here'],
  map: ['Map vote', 'candidate maps for the next wipe'],
  posts: ['News', 'server changelog, shown on the site'],
};

let showSeq = 0; // um clique rápido noutra secção cancela a renderização anterior

async function show(section) {
  const my = ++showSeq;
  SECTION = section;
  document.querySelectorAll('.ad-item').forEach((x) => x.classList.toggle('active', x.dataset.s === section));
  const [title, desc] = SECTION_META[section] || [section, ''];
  document.getElementById('sec-title').textContent = title;
  document.getElementById('sec-desc').textContent = desc;
  body().innerHTML = skelHTML(4);
  try {
    await SECTIONS[section]();
    if (my !== showSeq) return;
  } catch (e) {
    if (my !== showSeq) return;
    body().innerHTML = `<div class="notice err">Error: ${esc(e.message)}</div>`;
  }
  updateBadges();
}

// ---------- eventos globais ----------

async function unlock(auto = false) {
  KEY = document.getElementById('admin-key').value.trim();
  if (!KEY) return;
  try {
    await aGet('/api/admin/summary');
    sessionStorage.setItem('adminKey', KEY);
    document.getElementById('login-card').style.display = 'none';
    document.getElementById('panel').style.display = '';
    show('overview');
  } catch (e) {
    if (e.status === 401 || e.status === 403) {
      // chave rodada/errada: esquecer a guardada e voltar ao login limpo
      sessionStorage.removeItem('adminKey');
      KEY = '';
      if (!auto) alert('Invalid key.');
      document.getElementById('admin-key').value = '';
      document.getElementById('admin-key').focus();
    } else {
      alert('⚠️ Server unreachable — is it running? (' + e.message + ')');
    }
  }
}
document.getElementById('load-btn').addEventListener('click', unlock);
document.getElementById('admin-key').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

document.getElementById('lock-btn').addEventListener('click', () => {
  sessionStorage.removeItem('adminKey');
  location.reload();
});

document.getElementById('ad-side').addEventListener('click', (e) => {
  const b = e.target.closest('.ad-item[data-s]');
  if (b) show(b.dataset.s);
});
document.getElementById('sec-refresh').addEventListener('click', () => show(SECTION));

document.getElementById('section-body').addEventListener('click', (e) => {
  handleBodyClick(e).catch((err) => {
    alert('⚠️ ' + err.message);
    show(SECTION); // repõe o estado real depois de uma falha
  });
});

async function handleBodyClick(e) {
  const anyBtn = e.target.closest('#section-body button');
  if (anyBtn) {
    if (anyBtn.disabled) return;
    anyBtn.disabled = true;
    setTimeout(() => { anyBtn.disabled = false; }, 1500); // rearma caso não haja re-render
  }
  const st = e.target.closest('button[data-status]');
  if (st) {
    e.preventDefault();
    const { kind, id, status } = st.dataset;
    const url = { app: '/api/admin/applications', appeal: '/api/admin/appeals', redemption: '/api/admin/redemptions' }[kind];
    const payload = { id: parseInt(id, 10), status };
    if (kind === 'appeal') {
      const resp = document.querySelector(`input[data-response-for="${id}"]`);
      if (resp && resp.value.trim()) payload.response = resp.value.trim();
    }
    await aPost(url, payload);
    show(SECTION);
    return;
  }
  const ow = e.target.closest('button[data-close-ow]');
  if (ow) {
    e.preventDefault();
    await aPost('/api/admin/owcases/close', { id: parseInt(ow.dataset.closeOw, 10), verdict: ow.dataset.verdict, keepClip: !!ow.dataset.keep });
    show(SECTION);
    return;
  }
  const ma = e.target.closest('button[data-map-action]');
  if (ma) {
    e.preventDefault();
    if (ma.dataset.mapAction === 'new_round' && !confirm('A new round clears the current options and votes from the public view. Continue?')) return;
    await aPost('/api/admin/mapvote', { action: ma.dataset.mapAction });
    show(SECTION);
    return;
  }
  const dp = e.target.closest('button[data-del-post]');
  if (dp) {
    e.preventDefault();
    if (!confirm('Delete this post?')) return;
    await aPost('/api/admin/posts/delete', { id: parseInt(dp.dataset.delPost, 10) });
    show(SECTION);
    return;
  }
  const db = e.target.closest('button[data-del-ban]');
  if (db) {
    e.preventDefault();
    if (!confirm('Remove this ban from the public list?')) return;
    await aPost('/api/admin/bans', { action: 'delete', id: parseInt(db.dataset.delBan, 10) });
    show(SECTION);
  }
}

if (KEY) {
  document.getElementById('admin-key').value = KEY;
  unlock(true);
} else {
  document.getElementById('admin-key').focus();
}
</script>
