<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='0,0 50,0 64,14 64,64 0,64' fill='%23ff5b26'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230b0d11'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <nav class="nav">
    <a class="logo" href="/"><b data-brand></b> <span style="font-size:13px;color:var(--ink-muted);letter-spacing:0">admin</span></a>
    <div class="links"><a href="/">← back to site</a></div>
  </nav>
</header>

<main>
  <div class="card" id="login-card" style="max-width:420px;margin-top:6px">
    <h3>Admin key</h3>
    <input type="text" id="admin-key" placeholder="paste the adminKey from config.json">
    <button class="btn" style="margin-top:12px" id="load-btn">Enter</button>
    <p class="hint" style="color:var(--ink-muted);font-size:12px;margin-top:8px">The key is in server/config.json (adminKey field). Never share it.</p>
  </div>

  <div id="panel" style="display:none">
    <div class="tabs" id="section-tabs" style="margin-top:6px">
      <button data-s="apps" class="active">Applications</button>
      <button data-s="appeals">Appeals</button>
      <button data-s="redemptions">Store / Deliveries</button>
      <button data-s="ow">Overwatch</button>
      <button data-s="bans">Bans</button>
      <button data-s="map">Map vote</button>
      <button data-s="posts">News</button>
    </div>
    <div id="section-body" style="margin-top:14px"></div>
  </div>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
let KEY = sessionStorage.getItem('adminKey') || '';
let SECTION = 'apps';

const H = () => ({ 'X-Admin-Key': KEY });
const aGet = (p) => fetch(p, { headers: H() }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
const aPost = (p, b) => apiPost(p, b, H());
const body = () => document.getElementById('section-body');
const badge = (s) => `<span class="badge ${esc(s)}">${esc(s)}</span>`;
const statusButtons = (kind, id, current, statuses) => `
  <div class="tabs" style="margin:10px 0 0">
    ${statuses.map((s) => `<button data-kind="${kind}" data-id="${id}" data-status="${s}" ${s === current ? 'class="active"' : ''}>${s}</button>`).join('')}
  </div>`;

// ---------- secções ----------

async function renderApps() {
  const { rows } = await aGet('/api/admin/applications');
  body().innerHTML = rows.map((a) => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b style="font-size:16px">${esc(a.name)}</b>
        <span style="color:var(--ink-muted);font-size:13px">${esc(a.discord)} · ${esc(a.steam_id)} · ${a.age ?? '?'} yrs · ${a.hours_played ?? '?'}h · ${esc(a.timezone || '—')}</span>
        <span style="margin-left:auto">${badge(a.status)}</span>
      </div>
      <div style="color:var(--ink-muted);font-size:12px;margin:4px 0 8px">${new Date(a.ts * 1000).toLocaleString('en-GB')} · availability: ${esc(a.availability || '—')}</div>
      <details><summary style="cursor:pointer;color:var(--accent);font-size:13px">full answers</summary>
        <div class="prose" style="margin-top:10px;font-size:13.5px">
          <p><b>Experience:</b> ${esc(a.experience || '—')}</p>
          <p><b>Motivation:</b> ${esc(a.motivation || '—')}</p>
          <p><b>Scenario 1 (suspected clan, no proof):</b> ${esc(a.scenario1 || '—')}</p>
          <p><b>Scenario 2 (accused friend):</b> ${esc(a.scenario2 || '—')}</p>
          <p><b>Scenario 3 (accused of admin abuse):</b> ${esc(a.scenario3 || '—')}</p>
        </div>
      </details>
      ${statusButtons('app', a.id, a.status, ['pending', 'reviewing', 'interview', 'approved', 'rejected'])}
    </div>`).join('') || '<p style="color:var(--ink-muted)">No applications.</p>';
}

async function renderAppeals() {
  const { rows } = await aGet('/api/admin/appeals');
  body().innerHTML = rows.map((a) => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(a.player_name || a.steam_id)}</b>
        <span style="color:var(--ink-muted);font-size:13px">${esc(a.discord || 'no discord')} · ${timeAgo(a.ts)}</span>
        <span style="margin-left:auto">${badge(a.status)}</span>
      </div>
      <p style="color:var(--ink-2);font-size:13.5px;margin-top:8px">${esc(a.text)}</p>
      ${a.response ? `<p style="margin-top:8px;font-size:13px"><b>Reply:</b> ${esc(a.response)}</p>` : ''}
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="text" data-response-for="${a.id}" placeholder="reply to the player…" style="flex:1;min-width:220px">
      </div>
      ${statusButtons('appeal', a.id, a.status, ['pending', 'reviewing', 'accepted', 'rejected'])}
    </div>`).join('') || '<p style="color:var(--ink-muted)">No appeals.</p>';
}

async function renderRedemptions() {
  const { rows } = await aGet('/api/admin/redemptions');
  body().innerHTML = `
    <p style="color:var(--ink-muted);font-size:13px;margin-bottom:10px">
      Redemptions with a command are delivered automatically by the plugin ("sent" → "delivered").
      The rest are delivered manually in-game and marked here.</p>` +
    (rows.map((r) => `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(r.item_name || r.item_id)}</b>
        <span style="color:var(--ink-muted);font-size:13px">${esc(r.player_name || r.steam_id)} · ${r.cost.toLocaleString('en-GB')} 💎 · ${timeAgo(r.ts)}</span>
        <span style="margin-left:auto">${badge(r.status)}</span>
      </div>
      ${r.command ? `<code style="font-size:12px;color:var(--ink-muted)">${esc(r.command)}</code>` : '<span style="font-size:12px;color:var(--gold)">manual delivery</span>'}
      ${statusButtons('redemption', r.id, r.status, ['pending', 'sent', 'delivered', 'failed'])}
    </div>`).join('') || '<p style="color:var(--ink-muted)">No redemptions.</p>');
}

async function renderOw() {
  const { rows } = await aGet('/api/admin/owcases');
  body().innerHTML = `
    <form id="ow-form" class="card" style="margin-bottom:14px">
      <b>New case</b>
      <div class="form-grid" style="margin-top:10px">
        <div class="field"><label>Title (no player names!)</label><input name="title" required maxlength="120"></div>
        <div class="field"><label>Clip URL (YouTube/Streamable)</label><input name="clipUrl" required maxlength="300"></div>
      </div>
      <button class="btn" style="margin-top:12px">Publish case</button>
    </form>` +
    rows.map((c) => `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(c.title)}</b> ${badge(c.status)}
        <a href="${esc(c.clip_url)}" target="_blank" rel="noopener" style="font-size:13px">🎬 clip</a>
        <span style="margin-left:auto;font-size:13px;color:var(--ink-2)">
          🚨 ${c.tally.cheat} · 🤔 ${c.tally.unsure} · ✅ ${c.tally.clean}</span>
      </div>
      ${c.status === 'open' ? `
        <div class="tabs" style="margin-top:10px">
          ${['cheater', 'innocent', 'inconclusive'].map((v) =>
            `<button data-close-ow="${c.id}" data-verdict="${v}">close: ${v}</button>`).join('')}
        </div>` : `<p style="font-size:13px;margin-top:6px">Verdict: <b>${esc(c.verdict)}</b></p>`}
    </div>`).join('');

  document.getElementById('ow-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await aPost('/api/admin/owcases', Object.fromEntries(new FormData(e.target).entries()));
    renderOw();
  });
}

async function renderBans() {
  const { rows } = await aGet('/api/admin/bans');
  body().innerHTML = `
    <p style="color:var(--ink-muted);font-size:13px;margin-bottom:10px">
      This list feeds the public transparency page and the Discord webhook.
      Publish only the in-game name — never personal data.</p>
    <form id="ban-form" class="card" style="margin-bottom:14px">
      <b>Record a ban</b>
      <div class="form-grid" style="margin-top:10px">
        <div class="field"><label>Player name *</label><input name="steamName" required maxlength="64"></div>
        <div class="field"><label>Responsible admin *</label><input name="staffName" required maxlength="64"></div>
        <div class="field full"><label>Reason *</label><input name="reason" required maxlength="300" placeholder="e.g.: Confirmed aimbot (recording published)"></div>
        <div class="field full"><label>Evidence link (optional)</label><input name="evidence" maxlength="300" placeholder="https://youtu.be/…"></div>
      </div>
      <button class="btn" style="margin-top:12px">Record ban</button>
    </form>` +
    rows.map((b) => `
      <div class="card" style="margin-bottom:8px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(b.steam_name)}</b>
        <span style="color:var(--ink-2);font-size:13.5px">${esc(b.reason)}</span>
        <span style="color:var(--ink-muted);font-size:12.5px">${esc(b.staff_name)} · ${timeAgo(b.ts)}</span>
        ${b.evidence ? `<a href="${esc(b.evidence)}" target="_blank" rel="noopener" style="font-size:13px">🎬 evidence</a>` : ''}
        <button class="btn ghost" data-del-ban="${b.id}" style="margin-left:auto;padding:4px 12px;font-size:12px">remove</button>
      </div>`).join('');

  document.getElementById('ban-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await aPost('/api/admin/bans', Object.fromEntries(new FormData(e.target).entries()));
    renderBans();
  });
}

async function renderMap() {
  const state = await api('/api/mapvote');
  body().innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b>Round ${state.round}</b> ${badge(state.open ? 'open' : 'closed')}
        <button class="btn ghost" data-map-action="${state.open ? 'close' : 'open'}">${state.open ? 'Close voting' : 'Open voting'}</button>
        <button class="btn ghost" data-map-action="new_round">New round (clears options)</button>
      </div>
    </div>
    <form id="map-form" class="card" style="margin-bottom:14px">
      <b>Add candidate map</b>
      <div class="form-grid" style="margin-top:10px">
        <div class="field"><label>Name/description</label><input name="label" required maxlength="80" placeholder="Map A — classic, 2 lakes"></div>
        <div class="field"><label>Seed</label><input name="seed" maxlength="20"></div>
        <div class="field"><label>Size</label><input name="size" type="number" min="1000" max="6000" placeholder="3800"></div>
      </div>
      <button class="btn" style="margin-top:12px">Add</button>
    </form>` +
    state.options.map((o) => `
      <div class="card" style="margin-bottom:8px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b>${esc(o.label)}</b>
        <span style="color:var(--ink-muted);font-size:13px">seed ${esc(o.seed || '—')} · ${o.size || '—'}</span>
        <span style="margin-left:auto;font-size:13px"><b>${o.votes}</b> points (${o.voters} voters)</span>
      </div>`).join('');

  document.getElementById('map-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target).entries());
    await aPost('/api/admin/mapvote', { action: 'add', label: d.label, seed: d.seed, size: parseInt(d.size, 10) || null });
    renderMap();
  });
}

async function renderPosts() {
  const { rows } = await api('/api/posts');
  body().innerHTML = `
    <form id="post-form" class="card" style="margin-bottom:14px">
      <b>New post</b>
      <div class="field" style="margin-top:10px"><label>Title</label><input name="title" required maxlength="120"></div>
      <div class="field" style="margin-top:10px"><label>Body</label><textarea name="body" required maxlength="8000"></textarea></div>
      <button class="btn" style="margin-top:12px">Publish</button>
    </form>` +
    rows.map((p) => `
      <div class="card post" style="margin-bottom:10px">
        <div style="display:flex;gap:10px;align-items:baseline">
          <h3 style="margin:0">${esc(p.title)}</h3>
          <span style="color:var(--ink-muted);font-size:12px">${fmtDate(p.ts)}</span>
          <button class="btn ghost" data-del-post="${p.id}" style="margin-left:auto;padding:4px 12px;font-size:12px">delete</button>
        </div>
        <p style="margin-top:8px">${esc(p.body)}</p>
      </div>`).join('');

  document.getElementById('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await aPost('/api/admin/posts', Object.fromEntries(new FormData(e.target).entries()));
    renderPosts();
  });
}

const SECTIONS = { apps: renderApps, appeals: renderAppeals, redemptions: renderRedemptions, ow: renderOw, bans: renderBans, map: renderMap, posts: renderPosts };

async function show(section) {
  SECTION = section;
  document.querySelectorAll('#section-tabs button').forEach((x) => x.classList.toggle('active', x.dataset.s === section));
  body().innerHTML = '<p style="color:var(--ink-muted)">loading…</p>';
  try { await SECTIONS[section](); }
  catch (e) { body().innerHTML = `<div class="notice err">Error: ${esc(e.message)}</div>`; }
}

// ---------- eventos globais ----------

document.getElementById('load-btn').addEventListener('click', async () => {
  KEY = document.getElementById('admin-key').value.trim();
  if (!KEY) return;
  try {
    await aGet('/api/admin/applications');
    sessionStorage.setItem('adminKey', KEY);
    document.getElementById('login-card').style.display = 'none';
    document.getElementById('panel').style.display = '';
    show('apps');
  } catch { alert('Invalid key.'); }
});

document.getElementById('section-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-s]');
  if (b) show(b.dataset.s);
});

document.getElementById('section-body').addEventListener('click', async (e) => {
  const st = e.target.closest('button[data-status]');
  if (st) {
    e.preventDefault();
    const { kind, id, status } = st.dataset;
    const url = { app: '/api/admin/applications', appeal: '/api/admin/appeals', redemption: '/api/admin/redemptions' }[kind];
    const payload = { id: parseInt(id, 10), status };
    if (kind === 'appeal') {
      const resp = document.querySelector(`input[data-response-for="${id}"]`);
      if (resp && resp.value.trim()) payload.response = resp.value.trim();
    }
    await aPost(url, payload);
    show(SECTION);
    return;
  }
  const ow = e.target.closest('button[data-close-ow]');
  if (ow) {
    e.preventDefault();
    await aPost('/api/admin/owcases/close', { id: parseInt(ow.dataset.closeOw, 10), verdict: ow.dataset.verdict });
    show(SECTION);
    return;
  }
  const ma = e.target.closest('button[data-map-action]');
  if (ma) {
    e.preventDefault();
    if (ma.dataset.mapAction === 'new_round' && !confirm('A new round clears the current options and votes from the public view. Continue?')) return;
    await aPost('/api/admin/mapvote', { action: ma.dataset.mapAction });
    show(SECTION);
    return;
  }
  const dp = e.target.closest('button[data-del-post]');
  if (dp) {
    e.preventDefault();
    if (!confirm('Delete this post?')) return;
    await aPost('/api/admin/posts/delete', { id: parseInt(dp.dataset.delPost, 10) });
    show(SECTION);
    return;
  }
  const db = e.target.closest('button[data-del-ban]');
  if (db) {
    e.preventDefault();
    if (!confirm('Remove this ban from the public list?')) return;
    await aPost('/api/admin/bans', { action: 'delete', id: parseInt(db.dataset.delBan, 10) });
    show(SECTION);
  }
});

if (KEY) {
  document.getElementById('admin-key').value = KEY;
  document.getElementById('load-btn').click();
}
</script>
</body>
</html>
