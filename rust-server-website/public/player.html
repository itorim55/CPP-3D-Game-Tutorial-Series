<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player profile</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='0,0 50,0 64,14 64,64 0,64' fill='%23ff5b26'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230b0d11'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header></header>

<main id="content">
  <p style="color:var(--ink-muted)" data-i18n="loading">loading…</p>
</main>

<footer></footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const el = document.getElementById('content');
  if (!id) { el.innerHTML = '<p>Missing <code>id</code> parameter.</p>'; return; }

  let p;
  try { p = await api(`/api/player?id=${encodeURIComponent(id)}`); }
  catch (e) {
    // 404 do servidor ("Player not found") -> mensagem traduzida
    const msg = /not found/i.test(e.message) ? t('player.notSeen') : esc(e.message);
    el.innerHTML = `<p>😕 ${msg}</p><p><a href="/stats">${t('player.backToStats')}</a></p>`;
    return;
  }

  document.title = p.name;
  const w = p.wipe, a = p.allTime;

  const statTile = (big, label) => `
    <div class="card tile"><div class="big">${big}</div><div class="label">${label}</div></div>`;

  const gatherNames = {
    'wood': t('res.wood'), 'stone': t('res.stone'), 'metal.ore': t('res.metal'),
    'sulfur.ore': t('res.sulfur'), 'hq.metal.ore': t('res.hqm'),
  };

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px">
      ${pfp(p.avatar, p.name, 64, 'pfp-lg')}
      <h1 style="font-family:var(--font-display);font-size:44px;letter-spacing:2px">${esc(p.name)}</h1>
      ${p.elo ? `<span class="tier-stamp">${esc(p.elo.tier)} · ${p.elo.rating}</span>` : ''}
      ${Date.now() / 1000 - p.lastSeen < 600
        ? `<span class="live-badge"><span class="pulse"></span>${t('player.onlineNow')}</span>`
        : ''}
      <span style="color:var(--ink-muted);font-size:13px">SteamID ${esc(p.steamId)} · ${t('seen', timeAgo(p.lastSeen))}</span>
    </div>

    ${p.badges.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">
      ${p.badges.map((b) => `<span title="${esc(b.desc)}" style="background:var(--surface);border:1px solid var(--line);padding:6px 14px;font-size:13px;cursor:help">${b.icon} <b>${esc(b.name)}</b></span>`).join('')}
      <a href="/conquistas" style="font-size:12.5px">${t('player.allBadges')}</a>
    </div>` : ''}

    ${p.team ? `<p style="margin-top:12px;font-size:14px;color:var(--ink-2)">${t('player.team')}
      ${p.team.members.map((m, i) => playerLink(m, p.team.names[i])).join(', ')}</p>` : ''}

    <div class="seg" id="scope-seg" style="margin-top:26px">
      <button class="active" data-scope="wipe">${t('vs.thisWipe')}</button>
      <button data-scope="all">${t('vs.allTime')}</button>
    </div>
    <div class="grid cols-4" id="tiles-wipe">
      ${statTile(fmtNum(w.kills), t('player.kills'))}
      ${statTile(fmtNum(w.deaths), t('player.deathsPvp'))}
      ${statTile(w.kd.toFixed(2), 'K/D')}
      ${statTile(w.hsRate + '%', t('player.hsRate'))}
      ${statTile(Math.round(w.bestDistance) + 'm', t('player.longest'))}
      ${statTile(p.streak ? '🔥 ' + p.streak : '0', t('player.streakTile'))}
      ${statTile('💥 ' + fmtNum(p.structuresDestroyed), t('player.structuresTile'))}
      ${statTile(hours(p.playtimeS), t('player.playtimeTotal'))}
      ${p.aim ? statTile(`🎯 ${p.aim.accPct}%`, t('player.aimTile', fmtNum(p.aim.shots))) : ''}
    </div>
    <div class="grid cols-4" id="tiles-all" style="display:none">
      ${statTile(fmtNum(a.kills), t('player.kills'))}
      ${statTile(fmtNum(a.deaths), t('player.deaths'))}
      ${statTile(a.kd.toFixed(2), 'K/D')}
      ${statTile(fmtNum(a.headshots), t('player.headshots'))}
    </div>

    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn ghost" href="/vs?a=${encodeURIComponent(p.steamId)}">${t('player.compare')}</a>
      <a class="btn ghost" href="/wrapped?id=${encodeURIComponent(p.steamId)}">🎁 ${t('player.wrapped')}</a>
    </div>

    <div class="card" style="border-left:3px solid var(--line-2);margin-top:18px;padding:13px 18px">
      <p style="font-size:13.5px;color:var(--ink-2);margin:0">${t('player.reportBox')}</p>
    </div>

    ${p.trend && p.trend.length >= 2 ? `
    <h2 class="section">${t('player.progress')}</h2>
    <div class="card"><div id="trend-chart"></div>
      <p style="color:var(--ink-muted);font-size:12px;margin-top:8px">${t('player.progressHint')}</p></div>` : ''}

    <div class="grid cols-2" style="margin-top:28px">
      <div class="card">
        <h3>${t('player.favWeapons')}</h3>
        ${p.weapons.length ? `<table><tbody>${p.weapons.map((x) => `
          <tr><td>${esc(x.weapon)}</td><td class="num">${t('player.killsUnit', x.kills)}</td></tr>`).join('')}</tbody></table>`
          : `<p style="color:var(--ink-muted);font-size:13px">${t('player.noKillsWipe')}</p>`}
      </div>
      <div class="card">
        <h3>${t('player.gather')}</h3>
        ${p.gather.length ? `<table><tbody>${p.gather.map((g) => `
          <tr><td>${gatherNames[g.resource] || esc(g.resource)}</td><td class="num">${fmtNum(g.amount)}</td></tr>`).join('')}</tbody></table>`
          : `<p style="color:var(--ink-muted);font-size:13px">${t('player.noFarm')}</p>`}
      </div>
      <div class="card">
        <h3>${t('player.victims')}</h3>
        ${p.victims.length ? p.victims.map((v) => `
          <p style="font-size:14px">${playerLink(v.steam_id, v.name || v.steam_id)} <span style="color:var(--ink-muted)">× ${v.n}</span></p>`).join('')
          : '<p style="color:var(--ink-muted);font-size:13px">—</p>'}
      </div>
      <div class="card">
        <h3>${t('player.nemesis')}</h3>
        ${p.nemesis.length ? p.nemesis.map((v) => `
          <p style="font-size:14px">${playerLink(v.steam_id, v.name || v.steam_id)} <span style="color:var(--ink-muted)">× ${v.n}</span></p>`).join('')
          : '<p style="color:var(--ink-muted);font-size:13px">—</p>'}
      </div>
    </div>

    <h2 class="section">${t('player.activity')}</h2>
    <div class="feed">
      ${(actRow => p.recent.slice(0, 10).map(actRow).join('') +
        (p.recent.length > 10 ? `<div id="act-more" style="display:none">${p.recent.slice(10).map(actRow).join('')}</div>
          <button class="btn ghost" id="act-more-btn" style="margin-top:10px;padding:7px 16px;font-size:12.5px">${t('player.moreActivity', p.recent.length - 10)}</button>` : ''))((k) => {
        const isKill = k.attacker_id === p.steamId;
        return `<div class="row">
          <span class="who ${isKill ? 'k' : 'v'}">${isKill ? t('player.killed') : t('player.diedTo')}</span>
          <span class="who k">${esc(isKill ? (k.victim_name || '?') : (k.attacker_name || '?'))}</span>
          <span class="weapon">${esc(k.weapon || '?')}${k.distance ? ` · ${Math.round(k.distance)}m` : ''}</span>
          ${k.headshot ? '<span class="hs">HS</span>' : ''}
          <span class="meta">${timeAgo(k.ts)}</span>
        </div>`;
      }) || `<p style="color:var(--ink-muted)">${t('player.noActivity')}</p>`}
    </div>`;

  // toggle wipe/all-time + expandir atividade
  document.getElementById('scope-seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    document.querySelectorAll('#scope-seg button').forEach((x) => x.classList.toggle('active', x === b));
    document.getElementById('tiles-wipe').style.display = b.dataset.scope === 'wipe' ? '' : 'none';
    document.getElementById('tiles-all').style.display = b.dataset.scope === 'all' ? '' : 'none';
  });
  document.getElementById('act-more-btn')?.addEventListener('click', (e) => {
    document.getElementById('act-more').style.display = '';
    e.target.remove();
  });

  const trendEl = document.getElementById('trend-chart');
  if (trendEl) {
    renderAreaChart(trendEl,
      p.trend.map((d) => ({ hour: d.ts, kd: d.kd })),
      { xFmt: 'day', yKey: 'kd', yLabel: 'K/D' });
  }
})();
</script>
</body>
</html>
